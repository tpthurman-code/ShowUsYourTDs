name: Weekly Sleeper Recap

on:
  schedule:
    # Thursdays at 4:35pm Pacific. GitHub cron is always UTC and has no daylight
    # saving support, so both UTC times are listed and the "Check send time" step
    # below skips whichever one doesn't match Pacific time that day.
    - cron: "35 23 * * 4" # 4:35pm PDT (Mar-Nov)
    - cron: "35 0 * * 5"  # 4:35pm PST (Nov-Mar)
  workflow_dispatch:
    inputs:
      week:
        description: "Week to recap (leave blank for the last completed week)"
        required: false
      dry_run:
        description: "Build the recap without sending the email"
        type: boolean
        default: false

jobs:
  recap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check send time
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            if [ "$(TZ=America/Los_Angeles date +%Z)" = "PDT" ]; then want="35 23 * * 4"; else want="35 0 * * 5"; fi
            if [ "$SCHEDULE" != "$want" ]; then
              echo "Skipping: '$SCHEDULE' is not 4:35pm Pacific right now."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.skip != 'true'

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Build and send recap
        if: steps.gate.outputs.skip != 'true'
        env:
          SLEEPER_LEAGUE_ID: ${{ secrets.SLEEPER_LEAGUE_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          RECAP_WEEK: ${{ inputs.week }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python recap.py

      - name: Save recap as a build artifact
        if: always() && steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v5
        with:
          name: recap
          path: out/
          if-no-files-found: ignore
