name: Weekly Sleeper Recap

on:
  schedule:
    # Tuesdays at 8:00am Pacific. GitHub cron is always UTC and has no daylight
    # saving support, so both UTC times are listed and the "Check send time" step
    # below skips whichever one doesn't match Pacific time that day.
    - cron: "0 15 * * 2" # 8:00am PDT (Mar-Nov)
    - cron: "0 16 * * 2" # 8:00am PST (Nov-Mar)
  workflow_dispatch:
    inputs:
      week:
        description: "Week to recap (leave blank for the last completed week)"
        required: false
      channels:
        description: "Where to send it"
        type: choice
        options: [all, email, groupme]
        default: all
      dry_run:
        description: "Build the recap without sending anything"
        type: boolean
        default: false

jobs:
  recap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check send time
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            if [ "$(TZ=America/Los_Angeles date +%Z)" = "PDT" ]; then want="0 15 * * 2"; else want="0 16 * * 2"; fi
            if [ "$SCHEDULE" != "$want" ]; then
              echo "Skipping: '$SCHEDULE' is not 8:00am Pacific right now."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.skip != 'true'

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Build and send recap
        if: steps.gate.outputs.skip != 'true'
        env:
          SLEEPER_LEAGUE_ID: ${{ secrets.SLEEPER_LEAGUE_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GROUPME_BOT_ID: ${{ secrets.GROUPME_BOT_ID }}
          CHANNELS: ${{ inputs.channels }}
          RECAP_WEEK: ${{ inputs.week }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python recap.py

      - name: Save recap as a build artifact
        if: always() && steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: recap
          path: out/
          if-no-files-found: ignore
